server:
  listen_addr: "9091"
  timeout: "6s"
  cors_allowed_origins: ["*"]
  middlewares:
      - cors
      - logger
circuit_breaker:
    failure_threshold: 2
    retry_timeout: "30s"
    before:
      - logger
retry:
    attempts: 3
    backoff: exponential
    delay: "400ms"
services:
  users:
    name: users
    timeout: "10s"
    target: http://localhost:8000/api
    middlewares:
      - auth_jwt
    rate_limits:
      - type: bucket
        rate: 20
        burst: 1
      - type: window
        limit: 60
        interval: "1m"

    
