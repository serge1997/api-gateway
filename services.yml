server:
  listen_addr: "9091"
  timeout: "6s"
  cors_allowed_origins: ["http://127.0.0.1:5500"]
  read_header_timeout: "500ms"
service_lookup_header: "x-gateway-service"
middlewares:
    - logger
circuit_breaker:
    failure_threshold: 10
    retry_timeout: "30s"
    before:
      - logger
retry:
    attempts: 3
    backoff: exponential
    delay: "400ms"
services:
  users:
    name: users
    timeout: "10s"
    target: http://localhost:8000/api
    middlewares:
      - auth
    rate_limits:
      - type: bucket
        rate: 20
        burst: 5
      - type: window
        limit: 60
        interval: "60s"
