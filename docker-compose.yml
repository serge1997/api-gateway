services:
  app:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: api_gateway_app
    restart: unless-stopped
    volumes:
      - ./services.yml/:/services.yml
    ports:
      - 9091:9091
    networks:
      - api-gateway-network

networks:
  api-gateway-network:
    name: api-gateway-network
    driver: bridge